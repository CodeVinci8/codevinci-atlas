name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, tests, migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Установить uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.1"
      - name: Установить зависимости (frozen)
        run: uv sync --frozen
      - name: ruff (lint)
        run: uv run ruff check apps tests scripts
      - name: Миграции из пустой БД (0001 → … → 0004 head)
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-empty
          ATLAS_CONFIG_FILE: /nonexistent.yaml
        run: |
          mkdir -p "$ATLAS_DATA_DIR"
          uv run alembic upgrade head
          uv run python -c "import sqlite3,os; c=sqlite3.connect(os.path.join(os.environ['ATLAS_DATA_DIR'],'atlas.db')); t=set(r[0] for r in c.execute(\"select name from sqlite_master where type='table'\")); need={'audit_events','projects','briefs','map_versions','map_nodes','map_edges','decisions','approvals','vp_activations','vp_specs','work_orders','work_order_events','optimizer_decisions','job_packages','wo_checkpoints','handoff_packages','handoff_acks','rotation_records','alembic_version'}; assert need<=t, sorted(need-t); r=c.execute('select version_num from alembic_version').fetchone(); assert r[0]=='0004_work_orders', r; print('migration head ok (0004):', sorted(t))"
      - name: Апгрейд с предыдущей схемы (0002 → head) без потери таблиц VP-2
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-prev
          ATLAS_CONFIG_FILE: /nonexistent.yaml
        run: |
          mkdir -p "$ATLAS_DATA_DIR"
          uv run alembic upgrade 0002_project_workspace
          uv run python -c "import sqlite3,os; c=sqlite3.connect(os.path.join(os.environ['ATLAS_DATA_DIR'],'atlas.db')); r=c.execute('select version_num from alembic_version').fetchone(); assert r[0]=='0002_project_workspace', r"
          uv run alembic upgrade head
          uv run python -c "import sqlite3,os; c=sqlite3.connect(os.path.join(os.environ['ATLAS_DATA_DIR'],'atlas.db')); t=set(r[0] for r in c.execute(\"select name from sqlite_master where type='table'\")); assert {'projects','git_baselines','worktrees','briefs','approvals'}<=t, sorted(t); r=c.execute('select version_num from alembic_version').fetchone(); assert r[0]=='0004_work_orders', r; print('upgrade 0002->head ok')"
      - name: Апгрейд 0003 → head добавляет таблицы VP-4 без потери VP-0..3
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-0003
          ATLAS_CONFIG_FILE: /nonexistent.yaml
        run: |
          mkdir -p "$ATLAS_DATA_DIR"
          uv run alembic upgrade 0003_product_map
          uv run python -c "import sqlite3,os; c=sqlite3.connect(os.path.join(os.environ['ATLAS_DATA_DIR'],'atlas.db')); before=set(r[0] for r in c.execute(\"select name from sqlite_master where type='table'\")); assert 'work_orders' not in before, before; r=c.execute('select version_num from alembic_version').fetchone(); assert r[0]=='0003_product_map', r"
          uv run alembic upgrade head
          uv run python -c "import sqlite3,os; c=sqlite3.connect(os.path.join(os.environ['ATLAS_DATA_DIR'],'atlas.db')); t=set(r[0] for r in c.execute(\"select name from sqlite_master where type='table'\")); vp4={'vp_specs','work_orders','work_order_events','optimizer_decisions','job_packages','wo_checkpoints','handoff_packages','handoff_acks','rotation_records'}; vp03={'projects','briefs','map_versions','decisions','approvals','worktrees','git_baselines'}; assert vp4<=t, sorted(vp4-t); assert vp03<=t, sorted(vp03-t); r=c.execute('select version_num from alembic_version').fetchone(); assert r[0]=='0004_work_orders', r; print('upgrade 0003->head ok (VP-4 tables added)')"
      - name: Валидация контрактных JSON-схем VP-4 (подмножество валидатора)
        run: PYTHONPATH=apps/core:apps/runner uv run python scripts/validate_schemas.py
      - name: Юнит/интеграционные тесты (Core+Runner+UDS+ProductMap+WorkOrders)
        run: uv run python -m unittest discover -s tests -p 'test_*.py'
      - name: git diff --check
        run: git diff --check HEAD~1 HEAD || git diff --check || true

  web:
    name: Web (typecheck, i18n, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Включить pnpm
        run: corepack enable pnpm
      - name: Установка (frozen)
        run: pnpm install --frozen-lockfile
      - name: Проверка каталогов локалей
        run: pnpm check:i18n
      - name: TypeScript strict
        run: pnpm typecheck
      - name: Production-сборка
        run: pnpm build

  core-image:
    name: Core image (fresh-session consumer в образе)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать образ Core
        run: docker build -f infra/docker/core.Dockerfile -t atlas-core-ci .
      - name: Регрессия упаковки — consumer и run-result исполняются в образе
        run: bash scripts/check_core_image.sh atlas-core-ci

  security:
    name: Секрет-скан
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Полный секрет-скан (дерево + история + durable state)
        run: PYTHONPATH=apps/core python3 scripts/secret_scan.py
