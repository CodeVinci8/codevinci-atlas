[project]
name = "codevinci-atlas"
version = "0.1.0"
description = "Self-hosted центр управления Codex и Claude: Core, Runner, health, migrations, audit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
atlas = "atlas_core.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["apps/core/atlas_core", "apps/runner/atlas_runner"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web", "var"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["apps/core", "apps/runner", "tests"]
testpaths = ["tests"]
