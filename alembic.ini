# Alembic — миграции Core Atlas (Master Spec §8.1, §34)
[alembic]
script_location = apps/core/atlas_core/migrations
prepend_sys_path = apps/core:apps/runner
# URL берётся из окружения в env.py (ATLAS_*); здесь placeholder.
sqlalchemy.url = sqlite:///var/atlas.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
